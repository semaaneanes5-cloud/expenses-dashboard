<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفي — لوحة تحكم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0f7;--ink:#241a3a;--mute:#6a5f85;--card:#fff;--line:#d9d2e8;--acc:#6b3fd4;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f24;--ink:#ece6fa;--mute:#a79cc6;--card:#201838;--line:#39305a;--acc:#a98bff;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#150f24;--ink:#ece6fa;--mute:#a79cc6;--card:#201838;--line:#39305a;--acc:#a98bff;--bad:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px}
.tot{background:var(--acc);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px}
.tot b{display:block;font-size:38px;line-height:1.2}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}
form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
input,select,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
button{cursor:pointer}form button{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#er{color:var(--bad);min-height:1.5em;margin:6px 0 0;font-size:14px}
.bar{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bar i{display:block;height:12px;background:var(--acc);border-radius:6px;transition:width .3s}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.it small{color:var(--mute);display:block}.it button{background:none;color:var(--bad);border-color:var(--line);padding:4px 10px}
.em{color:var(--mute);margin:0}
@media (max-width:560px){form{grid-template-columns:1fr 1fr}form input:first-child,form button{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<h1>مصاريفي</h1><p class="sub">سجّل مصاريفك وشاهد أين يذهب مالك.</p>
<div class="tot">مجموع المصاريف<b id="t">0 دج</b></div>
<div class="p"><h2>إضافة مصروف</h2>
<form id="f"><input id="n" placeholder="الوصف، مثل: خبز" aria-label="الوصف"><input id="a" type="number" min="1" inputmode="numeric" placeholder="المبلغ" aria-label="المبلغ">
<select id="k" aria-label="الفئة"><option>طعام</option><option>نقل</option><option>فواتير</option><option>أخرى</option></select><button>أضف المصروف</button></form>
<p id="er" role="alert"></p></div>
<div class="p"><h2>حسب الفئة</h2><div id="g"></div></div>
<div class="p"><h2>آخر المصاريف</h2><div id="l"></div></div>
</main>
<script>
var K=["طعام","نقل","فواتير","أخرى"],D=[],$=function(i){return document.getElementById(i)};
try{D=JSON.parse(localStorage.getItem("exp")||"[]")}catch(e){D=[]}
function save(){try{localStorage.setItem("exp",JSON.stringify(D))}catch(e){}}
function fmt(n){return n.toLocaleString("ar-DZ")+" دج"}
function draw(){var s=D.reduce(function(a,x){return a+x.a},0);$("t").textContent=fmt(s);
var g=$("g");g.textContent="";K.forEach(function(k){var v=D.filter(function(x){return x.k==k}).reduce(function(a,x){return a+x.a},0);
var r=document.createElement("div");r.className="bar";var a=document.createElement("span");a.textContent=k;var b=document.createElement("div");var i=document.createElement("i");i.style.width=(s?Math.round(v/s*100):0)+"%";b.append(i);var c=document.createElement("span");c.textContent=fmt(v);r.append(a,b,c);g.append(r)});
var l=$("l");l.textContent="";
if(!D.length){var e=document.createElement("p");e.className="em";e.textContent="لا توجد مصاريف بعد. أضف أول مصروف من النموذج أعلاه.";l.append(e);return}
D.slice().reverse().forEach(function(x){var r=document.createElement("div");r.className="it";var d=document.createElement("div");d.textContent=x.n;var m=document.createElement("small");m.textContent=x.k+" · "+fmt(x.a);d.append(m);var b=document.createElement("button");b.textContent="احذف";b.setAttribute("aria-label","احذف "+x.n);b.onclick=function(){D=D.filter(function(y){return y.id!=x.id});save();draw()};r.append(d,b);l.append(r)})}
$("f").onsubmit=function(ev){ev.preventDefault();var n=$("n").value.trim(),a=Number($("a").value);
if(!n||!(a>0)){$("er").textContent="اكتب وصف المصروف ومبلغًا أكبر من صفر.";return}
$("er").textContent="";D.push({id:Date.now(),n:n,a:a,k:$("k").value});save();$("n").value="";$("a").value="";draw()};
draw();
</script>
</body>
</html>
